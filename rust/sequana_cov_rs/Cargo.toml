[package]
name = "sequana_cov_rs"
version = "0.1.0"
edition = "2021"
description = "Rust accelerators for sequana_coverage"
license = "BSD-3-Clause"

[lib]
name = "sequana_cov_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }
numpy = "0.30"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
